<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:6px">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <h1 id="h1" data-t="title_albero">Albero armi di Tri</h1>
      <select id="lang" class="langsel"></select>
    </div>
    <p class="lede" data-t="lede_albero"></p>
    <p class="note" id="fallback" hidden></p>
    <p class="note"><a href="__FUCINA_URL__" data-t="link_fucina"></a></p>
  </header>

  <div class="bar">
    <div class="seg" role="group" data-ta="mode">
      <button data-mode="once" data-t="mode_once"></button>
      <button data-mode="coll" data-t="mode_coll"></button>
    </div>
    <label class="chk"><input type="checkbox" id="lvon"> <span data-t="lv_toggle"></span></label>
    <span class="stat" id="stat"></span>
  </div>

  <div class="main">
    <section class="panel">
      <div class="tabs" id="ktabs" role="group"></div>
      <div class="row">
        <input type="search" id="q" data-tp="search_w">
        <button class="btn" id="allk" data-t="all_k"></button>
        <button class="btn" id="nonek" data-t="none_k"></button>
        <button class="btn" id="expk" data-t="exp_k"></button>
      </div>
      <div class="tree" id="tree"></div>
    </section>

    <section class="panel">
      <div id="detail"></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <h3 data-t="filter"></h3>
        <div class="tabs" id="kfilter" role="group"></div>
      </div>
      <div class="seg" role="group">
        <button data-view="mon" data-t="view_mon"></button>
        <button data-view="mat" data-t="view_mat"></button>
        <button data-view="oth" data-t="view_oth"></button>
        <button data-view="path" data-t="view_path"></button>
      </div>
      <div id="out"></div>
      <details>
        <summary class="note" data-t="save_sum"></summary>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
          <p class="note" data-t="save_help"></p>
          <textarea id="code" data-ta="save_sum"></textarea>
          <div class="row"><button class="btn" id="copy" data-t="copy"></button><button class="btn" id="load" data-t="load"></button><button class="btn" id="reset" data-t="reset"></button><span class="note" id="codemsg"></span></div>
        </div>
      </details>
    </section>
  </div>

  <footer class="note" style="display:flex;flex-direction:column;gap:6px">
    <p data-t="foot_once"></p><p data-t="foot_coll"></p><p data-t="foot_shop"></p><p data-t="foot_rank"></p>
    <p data-t="disclaimer"></p>__SOURCE__
  </footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
__I18N__
const W={};D.w.forEach(w=>W[w.id]=w);
const IT=D.items, MONS=D.mons, KINDS=D.kinds.map(k=>k[0]);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KN=k=>t('kinds')[k];
const WN=id=>esc(nm(W[id]));
let S={own:{},lv:{},mode:'once',lvon:false,kind:'GS',kf:Object.fromEntries(KINDS.map(k=>[k,true])),view:'mon',sel:null,collapsed:{},metric:'all',fromOwn:true};
try{const s=JSON.parse(localStorage.getItem('albero-tri')||'null');if(s)S=Object.assign(S,s,{sel:null})}catch(e){}
const save=()=>{try{const {sel,...k}=S;localStorage.setItem('albero-tri',JSON.stringify(k))}catch(e){}};
const monUnits=c=>Object.entries(c||{}).reduce((a,[i,n])=>a+(IT[i].g==='m'?n:0),0);
const add=(acc,c,k)=>{for(const [i,n] of Object.entries(c||{})){acc[k]=acc[k]||{};acc[k][i]=(acc[k][i]||0)+n}};
const sumC=(a,b)=>{const o=Object.assign({},a);for(const [i,n] of Object.entries(b||{}))o[i]=(o[i]||0)+n;return o};
const U=(c,metric)=>Object.entries(c||{}).reduce((a,[i,n])=>a+(metric==='mon'&&IT[i].g!=='m'?0:n),0);
// tutte le strade per un'arma: negozio, creazione, fuori dalla fucina, potenziamento da ogni arma di partenza
function allPaths(id,useOwn,target,depth=0){
  const w=W[id],o=[];
  if(useOwn&&S.own[id]&&id!==target) o.push({cost:{},steps:[{id,how:'own'}]});
  if(w.buy) o.push({cost:{},steps:[{id,how:'buy'}]});
  if(w.cr) o.push({cost:w.cr,steps:[{id,how:Object.keys(w.cr).length?'create':'other',m:w.cr}]});
  if(w.up&&depth<30) for(const p of w.p) for(const q of allPaths(p,useOwn,target,depth+1)){
    if(o.length>400) break; o.push({cost:sumC(q.cost,w.up),steps:q.steps.concat([{id,how:'up',m:w.up,from:p}])});}
  return o;
}
const sortP=(L,metric)=>L.sort((x,y)=>U(x.cost,metric)-U(y.cost,metric)||U(x.cost,'all')-U(y.cost,'all')||x.steps.length-y.steps.length);
const FRESH={};
const fresh=id=>(FRESH[id]=FRESH[id]||sortP(allPaths(id,false,id),'all')[0].cost);
function step(w){if(w.buy)return {};const o=[];if(w.cr)o.push(w.cr);if(w.up)o.push(w.up);return o.sort((a,b)=>U(a,'all')-U(b,'all'))[0]||{}}
const stepHow=w=>w.buy?'buy':(w.cr&&!Object.keys(w.cr).length)?'other':(w.cr&&(!w.up||U(w.cr,'all')<=U(w.up,'all')))?'create':'up';
const cost=w=>S.mode==='coll'?fresh(w.id):step(w);
function need(w){
  const out=[];
  if(!S.own[w.id]) out.push(cost(w));
  if(S.lvon&&w.lv){const cur=S.own[w.id]?(S.lv[w.id]||1):1;for(let L=2;L<=w.cap;L++) if(L>cur) out.push(w.lv[L-2]);}
  return out;
}
function totals(){
  const byK={};
  for(const w of D.w){ if(!S.kf[w.k]) continue; for(const c of need(w)) add(byK,c,w.k); }
  const all={};for(const k in byK) add(all,byK[k],'x');
  return {byK,all:all.x||{}};
}
function pill(i){const m=IT[i];return m.r?`<span class="pill ${m.r.toLowerCase()}">${m.r}</span>`:''}
function nameCell(o){const b=nm2(o);return esc(nm(o))+(b?`<small>${esc(b)}</small>`:'')}
// ---- albero
function buildTree(kind){
  const ws=D.w.filter(w=>w.k===kind);
  const q=$('q').value.trim().toLowerCase();
  const hit=w=>!q||Object.values(w.n).join(' ').toLowerCase().includes(q);
  const subHit=(w,seen=new Set())=>{if(seen.has(w.id))return false;seen.add(w.id);return hit(w)||w.c.some(c=>W[c]&&W[c].p[0]===w.id&&subHit(W[c],seen))};
  function li(w,parentId){
    const ref=w.p.length>1&&w.p[0]!==parentId;
    const kids=ref?[]:w.c.filter(c=>W[c]);
    if(q&&!ref&&!subHit(w)) return '';
    if(q&&ref&&!hit(w)) return '';
    const own=!!S.own[w.id];
    const b=[];
    if(w.buy) b.push(`<span class="badge shop" title="${w.buy.set?esc(t('b_shop_set_tt',{x:nm(W[w.buy.set])})):esc(t('b_shop_tt'))}">${t('b_shop')}</span>`);
    if(w.cr&&Object.keys(w.cr).length&&w.p.length) b.push(`<span class="badge" title="${esc(t('b_cr_tt'))}">${t('b_cr')}</span>`);
    if(w.p.length>1&&!ref) b.push(`<span class="badge" title="${esc(t('b_or_tt',{x:w.p.slice(1).map(p=>nm(W[p])).join(', ')}))}">${t('b_or',{n:w.p.length})}</span>`);
    if(w.hrf) b.push(`<span class="badge">${t('b_hrf')}</span>`);
    if(w.lv&&own) b.push(`<span class="badge">${t('lv')}${S.lv[w.id]||1}/${w.cap}</span>`);
    const col=S.collapsed[w.id], sub=nm2(w);
    let h=`<li class="${col?'hidden-c':''}"><div class="node ${own?'own':''} ${S.sel===w.id?'sel':''} ${ref?'ref':''}">`+
      `<button class="tog ${kids.length?'':'none'}" data-tog="${w.id}" aria-label="${esc(t('toggle'))}">${col?'▸':'▾'}</button>`+
      `<input type="checkbox" data-own="${w.id}" ${own?'checked':''} aria-label="${esc(t('owned'))}: ${WN(w.id)}">`+
      `<button class="nm" data-sel="${w.id}"><span>${WN(w.id)}${ref?' '+t('other_branch'):''}</span>${sub?`<small>${esc(sub)}</small>`:''}</button>${b.join('')}<span class="cost" title="${esc(t('cost_tt'))}">${monUnits(cost(w))}</span></div>`;
    if(kids.length) h+='<ul>'+kids.map(c=>li(W[c],w.id)).join('')+'</ul>';
    return h+'</li>';
  }
  return '<ul>'+ws.filter(w=>!w.p.length).map(r=>li(r,null)).join('')+'</ul>';
}
function renderTabs(){
  $('ktabs').innerHTML=KINDS.map(k=>{const ws=D.w.filter(w=>w.k===k);const o=ws.filter(w=>S.own[w.id]).length;
    return `<button class="tab" data-kind="${k}" aria-pressed="${S.kind===k}">${KN(k)}<small>${o}/${ws.length}</small></button>`}).join('');
  $('kfilter').innerHTML=KINDS.map(k=>`<button class="tab" data-kf="${k}" aria-pressed="${!!S.kf[k]}">${KN(k)}</button>`).join('')+
    `<button class="tab" data-kf="*" aria-pressed="false">${t('all')}</button><button class="tab" data-kf="-" aria-pressed="false">${t('none')}</button>`;
}
function matList(c){if(!c||!Object.keys(c).length) return `<p class="empty">${t('no_mats')}</p>`;
  return '<ul>'+Object.entries(c).map(([i,n])=>{const m=IT[i];return `<li>${esc(nm(m))} ×${n} ${pill(i)}${m.mon?` <span class="note">${esc(monName(m.mon))}</span>`:''}</li>`}).join('')+'</ul>'}
function renderDetail(){
  const w=W[S.sel]; if(!w){$('detail').innerHTML=`<p class="note">${t('detail_hint')}</p>`;return}
  const par=w.p.map(WN).join(', '), ch=w.c.filter(c=>W[c]).map(WN).join(', ');
  let lv='';
  if(w.lv){
    lv=`<div><h3>${t('lv_h')}</h3><div class="row"><label class="note" for="lvsel">${t('lv_cur')}</label><select id="lvsel" ${S.own[w.id]?'':'disabled'}>${Array.from({length:w.cap},(_,i)=>`<option ${(S.lv[w.id]||1)===i+1?'selected':''}>${i+1}</option>`).join('')}</select><span class="note">${w.hrf?t('lv_hr'):t('lv_lrhr')}</span></div>`+
      w.lv.map((c,i)=>`<details><summary class="note">${t('lv')}${i+1} → ${t('lv')}${i+2}</summary>${matList(c)}</details>`).join('')+'</div>';
  }
  const hasCr=w.cr&&Object.keys(w.cr).length, sub=nm2(w);
  const how={buy:t('how_buy'),create:t('how_create'),up:t('how_up'),other:t('how_other')}[stepHow(w)];
  $('detail').innerHTML=`<div class="detail"><div class="monh"><h2>${WN(w.id)}</h2><span class="note">${sub?esc(sub)+' · ':''}${KN(w.k)}</span>
    <label class="chk" style="margin-left:auto"><input type="checkbox" data-own="${w.id}" ${S.own[w.id]?'checked':''}> ${t('owned')}</label></div>
    ${w.buy?`<p class="shopnote">${w.buy.set?t('shop_set',{x:WN(w.buy.set)}):t('shop')} ${w.buy.off?t('shop_later'):t('shop_now')}</p>`:''}
    <div class="rec">${hasCr?`<div><h3>${t('create')}</h3>${matList(w.cr)}</div>`:''}${w.up?`<div><h3>${t('up_from',{x:par})}</h3>${matList(w.up)}</div>`:''}
    ${!hasCr&&!w.up&&!w.buy?`<div><p class="note">${t('not_forge')}</p></div>`:''}</div>
    <p class="note">${ch?t('up_into',{x:ch}):t('end_branch')}</p>
    <p class="note">${t('cost_now',{x:S.own[w.id]?`<span class="done">${t('already')}</span>`:`${t('mon_n',{n:monUnits(cost(w))})} (${S.mode==='coll'?t('how_coll'):how})`})}</p>
    <div class="row"><button class="btn" data-view="path">${t('calc_path')}</button></div>${lv}</div>`;
}
function renderPath(){
  const w=W[S.sel];
  const ctl=`<div class="row"><div class="seg" role="group" aria-label="${esc(t('minimize'))}">
      <button data-metric="all" aria-pressed="${S.metric==='all'}">${t('m_all')}</button>
      <button data-metric="mon" aria-pressed="${S.metric==='mon'}">${t('m_mon')}</button></div>
      <label class="chk"><input type="checkbox" id="fromown" ${S.fromOwn?'checked':''}> ${t('from_own')}</label></div>`;
  if(!w) return ctl+`<p class="note">${t('path_hint')}</p>`;
  const opts=sortP(allPaths(w.id,S.fromOwn,w.id),S.metric), b=opts[0];
  const desc=s=>s.how==='own'?t('s_own',{x:WN(s.id)}):
    s.how==='buy'?(W[s.id].buy.set?t('s_buy_set',{x:WN(W[s.id].buy.set)}):t('s_buy',{x:WN(s.id)})):
    s.how==='create'?t('s_create',{x:WN(s.id)}):s.how==='other'?t('s_other',{x:WN(s.id)}):t('s_up',{a:WN(s.from),b:WN(s.id)});
  const mats=m=>m&&Object.keys(m).length?'<ul class="pm">'+Object.entries(m).map(([i,n])=>`<li>${esc(nm(IT[i]))} ×${n} ${pill(i)}${IT[i].mon?` <span class="note">${esc(monName(IT[i].mon))}</span>`:''}</li>`).join('')+'</ul>':'';
  const sub=nm2(w);
  let h=ctl+`<div class="monh"><h2>${WN(w.id)}</h2><span class="note">${sub?esc(sub)+' · ':''}${KN(w.k)}</span></div>`;
  if(S.own[w.id]) h+=`<p class="done">${t('second')}</p>`;
  h+=`<p class="note">${t('path_sum',{s:b.steps.length,a:U(b.cost,'all'),m:U(b.cost,'mon')})}</p>`;
  h+='<ol class="path">'+b.steps.map(s=>`<li><span>${desc(s)}</span>${s.m?mats(s.m):''}</li>`).join('')+'</ol>';
  const tot=Object.entries(b.cost).sort((x,y)=>y[1]-x[1]);
  if(tot.length) h+=`<h3>${t('to_collect')}</h3><table><tbody>`+tot.map(([i,n])=>`<tr><td>${esc(nm(IT[i]))} <span class="note">${esc(IT[i].mon?monName(IT[i].mon):nm2(IT[i]))}</span> ${pill(i)}</td><td class="n">${n}</td></tr>`).join('')+'</tbody></table>';
  if(opts.length>1){
    h+=`<h3>${t('alts')}</h3><div class="scroll"><table><thead><tr><th>${t('start')}</th><th class="n">${t('steps')}</th><th class="n">${t('total')}</th><th class="n">${t('of_mon')}</th></tr></thead><tbody>`+
      opts.slice(0,6).map((o,k)=>{const s0=o.steps[0],x=nm(W[s0.id]);const lab=s0.how==='own'?t('a_own',{x}):s0.how==='buy'?t('a_shop',{x}):s0.how==='create'?t('a_create',{x}):x;
        return `<tr><td>${k===0?'<b>':''}${esc(lab)}${o.steps.length>1?' → … → '+WN(w.id):''}${k===0?'</b>':''}</td><td class="n">${o.steps.length}</td><td class="n">${U(o.cost,'all')}</td><td class="n">${U(o.cost,'mon')}</td></tr>`}).join('')+'</tbody></table></div>';
  }
  if(!S.own[w.id]) h+=`<div class="row"><button class="btn" id="pathdone">${b.steps[0].how==='own'?t('mark_rm',{x:WN(b.steps[0].id)}):t('mark')}</button></div>`;
  return h;
}
function renderOut(){
  const {byK,all}=totals();
  const ks=KINDS.filter(k=>S.kf[k]);
  let h='';
  if(S.view==='mon'){
    for(const m of MONS){
      const rows={LR:[],HR:[]};
      for(const [i,n] of Object.entries(all)){const it=IT[i];if(it.g==='m'&&it.mon===m) rows[it.r].push([i,n])}
      const a=rows.LR.reduce((s,x)=>s+x[1],0),b=rows.HR.reduce((s,x)=>s+x[1],0);
      if(!a&&!b) continue;
      const tb=L=>L.length?'<table><tbody>'+L.sort((x,y)=>y[1]-x[1]).map(([i,n])=>{
        const per=ks.filter(k=>byK[k]&&byK[k][i]).map(k=>`${KN(k)} ${byK[k][i]}`).join(' · ');
        const sub=nm2(IT[i]);
        return `<tr><td>${esc(nm(IT[i]))}<small>${esc([sub,per].filter(Boolean).join(' — '))}</small></td><td class="n">${n}</td></tr>`}).join('')+'</tbody></table>':`<p class="empty">${t('nothing')}</p>`;
      h+=`<div class="mon" id="m-${MONS.indexOf(m)}"><div class="monh"><h2>${esc(monName(m))}</h2><span class="n">LR ${a} · HR ${b}</span></div><div class="cols"><div><span class="pill lr">${t('lr')}</span>${tb(rows.LR)}</div><div><span class="pill hr">${t('hr')}</span>${tb(rows.HR)}</div></div></div>`;
    }
    if(!h) h=`<p class="done">${t('no_missing')}</p>`;
  } else if(S.view==='mat'){
    const cell=(k,m,r)=>{let s=0;for(const [i,n] of Object.entries(byK[k]||{})){const it=IT[i];if(it.g==='m'&&it.mon===m&&(!r||it.r===r))s+=n}return s};
    const tot={};let grand=0;
    const body=MONS.map((m,mi)=>{let rs=0;const tds=ks.map(k=>{const v=cell(k,m,S.mrank);rs+=v;tot[k]=(tot[k]||0)+v;return `<td class="n ${v?'':'z'}">${v||'·'}</td>`}).join('');grand+=rs;
      return rs?`<tr data-m="${mi}"><td>${esc(monName(m))}</td>${tds}<td class="n"><b>${rs}</b></td></tr>`:''}).join('');
    h=`<div class="row"><span class="note">${t('rank')}:</span><div class="seg" role="group">${['','LR','HR'].map(r=>`<button data-mr="${r}" aria-pressed="${(S.mrank||'')===r}">${r||t('both')}</button>`).join('')}</div></div>
      <div class="scroll"><table class="matrix"><thead><tr><th>${t('monster')}</th>${ks.map(k=>`<th class="n">${KN(k)}</th>`).join('')}<th class="n">${t('total')}</th></tr></thead><tbody>${body||`<tr><td class="empty">${t('nothing')}</td></tr>`}</tbody>
      <tfoot><tr><td>${t('total')}</td>${ks.map(k=>`<td class="n">${tot[k]||0}</td>`).join('')}<td class="n">${grand}</td></tr></tfoot></table></div>
      <p class="note">${t('mat_note')}</p>`;
  } else if(S.view==='path'){
    h=renderPath();
  } else {
    for(const g of ['gen','oth','coin']){
      const L=Object.entries(all).filter(([i])=>IT[i].g===g).sort((x,y)=>y[1]-x[1]);
      h+=`<div class="mon"><div class="monh"><h2>${t('g_'+g)}</h2></div>`+(L.length?'<table><tbody>'+L.map(([i,n])=>`<tr><td>${esc(nm(IT[i]))} <span class="note">${esc(nm2(IT[i]))}</span> ${pill(i)}</td><td class="n">${n}</td></tr>`).join('')+'</tbody></table>':`<p class="empty">${t('nothing')}</p>`)+'</div>';
    }
  }
  $('out').innerHTML=h;
  const mu=Object.entries(all).reduce((a,[i,n])=>a+(IT[i].g==='m'?n:0),0);
  $('stat').innerHTML=t('stat',{o:D.w.filter(w=>S.own[w.id]).length,t:D.w.length,m:mu});
}
function render(){
  applyStatic();
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===S.mode));
  document.querySelectorAll('.panel>.seg [data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===S.view));
  $('lvon').checked=S.lvon;
  renderTabs(); const sc=$('tree').scrollTop; $('tree').innerHTML=buildTree(S.kind); $('tree').scrollTop=sc;
  renderDetail(); renderOut(); $('code').value=btoa(Object.keys(S.own).filter(k=>S.own[k]).map(k=>k+(S.lv[k]>1?'@'+S.lv[k]:'')).join(','));
  save();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.mode){S.mode=b.dataset.mode;render()}
  else if(b.dataset.view){S.view=b.dataset.view;render();if(S.view==='path')$('out').scrollIntoView({block:'nearest'})}
  else if(b.dataset.metric){S.metric=b.dataset.metric;render()}
  else if(b.id==='pathdone'){const w=W[S.sel];const p=sortP(allPaths(w.id,S.fromOwn,w.id),S.metric)[0];if(p.steps[0].how==='own')delete S.own[p.steps[0].id];S.own[w.id]=true;render()}
  else if(b.dataset.kind){S.kind=b.dataset.kind;render()}
  else if(b.dataset.kf){const k=b.dataset.kf;if(k==='*'||k==='-')KINDS.forEach(x=>S.kf[x]=k==='*');else S.kf[k]=!S.kf[k];render()}
  else if(b.dataset.sel){S.sel=b.dataset.sel;render()}
  else if(b.dataset.tog){S.collapsed[b.dataset.tog]=!S.collapsed[b.dataset.tog];render()}
  else if(b.dataset.mr!==undefined){S.mrank=b.dataset.mr;render()}
});
document.addEventListener('change',e=>{
  const x=e.target;
  if(x.dataset.own){if(x.checked)S.own[x.dataset.own]=true;else delete S.own[x.dataset.own];render()}
  else if(x.id==='lvon'){S.lvon=x.checked;render()}
  else if(x.id==='fromown'){S.fromOwn=x.checked;render()}
  else if(x.id==='lvsel'){S.lv[S.sel]=+x.value;render()}
});
$('out').addEventListener('click',e=>{const tr=e.target.closest('tr[data-m]');if(tr){S.view='mon';render();const el=$('m-'+tr.dataset.m);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}});
$('q').addEventListener('input',()=>{$('tree').innerHTML=buildTree(S.kind)});
$('allk').onclick=()=>{D.w.filter(w=>w.k===S.kind).forEach(w=>S.own[w.id]=true);render()};
$('nonek').onclick=()=>{D.w.filter(w=>w.k===S.kind).forEach(w=>delete S.own[w.id]);render()};
$('expk').onclick=()=>{const ws=D.w.filter(w=>w.k===S.kind&&w.c.length);const any=ws.some(w=>!S.collapsed[w.id]);ws.forEach(w=>S.collapsed[w.id]=any);render()};
$('copy').onclick=()=>{const v=$('code').value;navigator.clipboard.writeText(v).then(()=>$('codemsg').textContent=t('copied'),()=>{$('code').select();$('codemsg').textContent=t('copy_sel')})};
$('load').onclick=()=>{try{const s=atob($('code').value.trim());S.own={};S.lv={};s.split(',').filter(Boolean).forEach(x=>{const [id,l]=x.split('@');if(W[id]){S.own[id]=true;if(l)S.lv[id]=+l}});render();$('codemsg').textContent=t('loaded')}catch(err){$('codemsg').textContent=t('bad_code')}};
$('reset').onclick=()=>{const r=$('reset');if(r.dataset.arm){S.own={};S.lv={};delete r.dataset.arm;render();$('codemsg').textContent=t('cleared')}else{r.dataset.arm=1;r.textContent=t('reset_ok')}};
langSelect(render);
render();
</script>

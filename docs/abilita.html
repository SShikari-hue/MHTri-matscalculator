:root{

  --lr:#1f7a6d; --lr-soft:#dff1ed; --hr:#b4580f; --hr-soft:#fbe9d8; --accent:#2b4a63; --on-accent:#ffffff; --own:#3f7d3a; --own-soft:#e3f0df;
  --f-head:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --lr:#5cc4b3; --lr-soft:#173430; --hr:#f0a35e; --hr-soft:#3a2614; --accent:#8fb3d1; --on-accent:#10161b; --own:#86c47e; --own-soft:#1d3119; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171b; --panel:#1a2127; --fg:#e4e9ec; --muted:#93a1ab; --line:#2c363e; --sunk:#151b20;
  --lr:#5cc4b3; --lr-soft:#173430; --hr:#f0a35e; --hr-soft:#3a2614; --accent:#8fb3d1; --on-accent:#10161b; --own:#86c47e; --own-soft:#1d3119; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1320px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.2rem;font-weight:700;line-height:1.05}
h2{font-size:1.4rem;font-weight:600}
h3{font-size:.95rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0;max-width:72ch}
.lede{color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}

.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.stat{font-family:var(--f-num);font-size:12.5px;color:var(--muted);margin-left:auto}
.stat b{color:var(--fg);font-weight:500}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--accent)}
.main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:4px 10px;cursor:pointer;font-size:12.5px;display:inline-flex;gap:6px;align-items:baseline}
.tab small{font-family:var(--f-num);color:var(--muted);font-size:11px}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tab[aria-pressed="true"] small{color:inherit;opacity:.8}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.tree{max-height:72vh;overflow:auto;border-top:1px solid var(--line);padding-top:6px}
@media (max-width:900px){.tree{max-height:none}}
.tree ul{list-style:none;margin:0;padding:0 0 0 16px;border-left:1px dashed var(--line)}
.tree>ul{padding-left:0;border-left:0}
.tree li{margin:0}
.node{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:6px}
.node:hover{background:var(--sunk)}
.node.sel{background:var(--sunk);box-shadow:inset 2px 0 0 var(--accent)}
.node input{margin:0;accent-color:var(--own);width:15px;height:15px;flex:none}
.node .nm{background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0;flex:1;display:flex;flex-direction:column}
.node .nm span{font-size:13.5px}
.node .nm small{font-size:11.5px;color:var(--muted)}
.node.own .nm span{color:var(--own)}
.node .cost{font-family:var(--f-num);font-size:11.5px;color:var(--muted);flex:none}
.node.own .cost{visibility:hidden}
.badge{font-size:10.5px;font-weight:600;letter-spacing:.05em;padding:1px 6px;border-radius:99px;background:var(--sunk);color:var(--muted);border:1px solid var(--line);flex:none}
.tog{width:18px;flex:none;background:none;border:0;cursor:pointer;color:var(--muted);padding:0;font-size:11px}
.tog.none{visibility:hidden}
.ref .nm span{font-style:italic;color:var(--muted)}
.hidden-c>ul{display:none}
.detail{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.detail .rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.detail ul{margin:0;padding-left:16px}
.pill{display:inline-block;font:600 10.5px var(--f-body);letter-spacing:.08em;padding:2px 7px;border-radius:99px}
.pill.lr{background:var(--lr-soft);color:var(--lr)}.pill.hr{background:var(--hr-soft);color:var(--hr)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.n{text-align:right;font-family:var(--f-num);font-size:12.5px;white-space:nowrap}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.matrix td.z{color:var(--line)}
.matrix tbody tr{cursor:pointer}
.matrix tbody tr:hover td{background:var(--sunk)}
.matrix tfoot td{font-weight:600;border-top:2px solid var(--line)}
.mon{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;scroll-margin-top:120px}
.monh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.monh .n{color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.cols>div{min-width:0}

.empty{color:var(--muted);font-style:italic;font-size:12.5px}
.done{color:var(--own);font-weight:500}
.note{font-size:12.5px;color:var(--muted)}
textarea{width:100%;min-height:60px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--f-num);font-size:11.5px}

.shopnote{font-size:12.5px;color:var(--own)}

.z{color:var(--line)}

.btn:disabled{opacity:.5;cursor:default}
.detail.res{gap:6px}
.detail.res table td{padding:3px 8px}
#res{display:flex;flex-direction:column;gap:10px}

let LANG='it';
try{const l=localStorage.getItem('tri-lang');if(l&&TXT[l])LANG=l;else{const n=(navigator.language||'').slice(0,2);if(TXT[n])LANG=n}}catch(e){}
const t=(k,v)=>{let s=(TXT[LANG][k]!==undefined?TXT[LANG][k]:TXT.it[k]);if(v&&typeof s==='string')for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};
const GL=()=>GAME_LANGS.includes(LANG)?LANG:'en';
const nm=o=>o.n[GL()]||o.n.en;                           // nome di gioco di un'arma o materiale
const nm2=o=>LANG==='en'?'':(GAME_LANGS.includes(LANG)?o.n.en:'');  // nome inglese come riferimento
function monName(k){if(k==='Rathian + Rathalos')return t('grp_rr');if(k.startsWith('Draghi anziani'))return t('grp_elder');
  const m=(D.mnames||{})[k];return m?(m[LANG]||m.en):k}
function langSelect(onchange){
  const s=document.getElementById('lang');
  s.innerHTML=LANGS.map(([c,n])=>`<option value="${c}" ${c===LANG?'selected':''}>${n}</option>`).join('');
  s.setAttribute('aria-label',t('lang'));
  s.addEventListener('change',()=>{LANG=s.value;try{localStorage.setItem('tri-lang',LANG)}catch(e){}document.documentElement.lang=LANG;onchange()});
  document.documentElement.lang=LANG;
}
function applyStatic(){document.querySelectorAll('[data-t]').forEach(el=>{el.innerHTML=t(el.dataset.t)});
  document.querySelectorAll('[data-tp]').forEach(el=>{el.placeholder=t(el.dataset.tp)});
  document.querySelectorAll('[data-ta]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.ta))});
  const fb=document.getElementById('fallback');if(fb){fb.hidden=GAME_LANGS.includes(LANG);fb.textContent=t('fallback')}
  const h=document.getElementById('h1');if(h)document.title=h.textContent;}

const A={};D.armor.forEach(a=>A[a.id]=a);
const J={};D.decos.forEach(j=>J[j.id]=j);
const IT=D.items, PARTS=['Helm','Body','Arm','Waist','Leg'], LIMIT=100, MAXTIME=25000;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TM=k=>D.terms[k][GL()]||D.terms[k].en, PN=TM;
const SKN=i=>(D.skills[GL()]||D.skills.en)[i]||'?';
const ACN=i=>(D.actn[GL()]||D.actn.en)[i]||'?';
const POS=D.acts.filter(a=>a[1]>0);                       // [albero, soglia, abilita']
let S={want:[],cls:'b',sex:'m',rk:'HR',ws:0,ts:0,tk1:0,tp1:0,tk2:0,tp2:0,onlyOwn:false,ownJ:true,sort:'mat'};
try{const s=JSON.parse(localStorage.getItem('abilita-tri')||'null');if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem('abilita-tri',JSON.stringify(S))}catch(e){}};
function owned(key){try{return (JSON.parse(localStorage.getItem(key)||'{}').own)||{}}catch(e){return {}}}
// ---- metriche di costo di una ricetta
function metrics(c){let mon=0,all=0,eff=0,pw=0,pn=0;
  for(const [i,n] of Object.entries(c||{})){const it=IT[i];all+=n;if(it.g==='m'){mon+=n;if(it.p){eff+=n/it.p;pw+=n*it.p;pn+=n}else eff+=n*20}}
  return {mon,all,eff,pw,pn}}
const addM=(a,b)=>({mon:a.mon+b.mon,all:a.all+b.all,eff:a.eff+b.eff,pw:a.pw+b.pw,pn:a.pn+b.pn});
const ZERO={mon:0,all:0,eff:0,pw:0,pn:0};
const pieceRank=a=>Object.keys(a.cr).some(i=>IT[i].r==='HR')?'HR':'LR';
// ---- ricerca
let RUN=null;
function search(){
  const want=S.want.map(([tr,thr])=>({tr,thr}));
  if(!want.length){$('status').textContent=t('no_want');return}
  const K=want.length, oa=owned('armature-tri'), oj=S.ownJ?owned('gioielli-tri'):{};
  const vec=sk=>{const v=new Array(K).fill(0);for(const [i,n] of sk){const k=want.findIndex(w=>w.tr===i);if(k>=0)v[k]+=n}return v};
  // talismano: punti fissi
  const tal=new Array(K).fill(0);
  [[S.tk1,S.tp1],[S.tk2,S.tp2]].forEach(([i,n])=>{const k=want.findIndex(w=>w.tr===+i);if(k>=0)tal[k]+=+n||0});
  // pezzi candidati per parte, poi solo quelli non dominati
  const cand=PARTS.map(p=>{
    let L=D.armor.filter(a=>a.k===p&&a.cl.includes(S.cls)&&a.sx.includes(S.sex)&&(S.rk==='HR'||pieceRank(a)==='LR')&&(!S.onlyOwn||oa[a.id]))
      .map(a=>({id:a.id,v:vec(a.sk),sl:a.sl,df:a.df,m:(oa[a.id]||a.buy)?ZERO:metrics(a.cr)}));
    if(!S.onlyOwn) L.push({id:null,v:new Array(K).fill(0),sl:0,df:0,m:ZERO});
    // stessi punti e spazi: tengo solo il migliore per materiali, per drop e per difesa
    const G={};for(const x of L){const k=x.v.join(',')+'|'+x.sl;(G[k]=G[k]||[]).push(x)}
    L=[];for(const g of Object.values(G)){const keep=new Set([g.reduce((a,b)=>b.m.mon<a.m.mon?b:a),g.reduce((a,b)=>b.m.eff<a.m.eff?b:a),g.reduce((a,b)=>b.df>a.df?b:a)]);L.push(...keep)}
    const dom=(x,y)=>x.v.every((a,k)=>a>=y.v[k])&&x.sl>=y.sl&&x.m.mon<=y.m.mon&&x.m.eff<=y.m.eff&&x.df>=y.df;
    L=L.filter((y,i)=>!L.some((x,j)=>j!==i&&dom(x,y)&&(!dom(y,x)||j<i)));
    return L.sort((a,b)=>b.v.reduce((s,x)=>s+x,0)-a.v.reduce((s,x)=>s+x,0)||b.sl-a.sl).slice(0,60);
  });
  if(cand.some(L=>!L.length)){LASTRES={TOP:{mat:[],drop:[],def:[]},found:0,secs:'0.0',cut:false};render();return}
  // gioielli utili: almeno un punto positivo in un'abilita' cercata
  const jw=D.decos.filter(j=>j.sk.some(([i,n])=>n>0&&want.some(w=>w.tr===i))).map(j=>({id:j.id,sz:j.sz,v:vec(j.sk),m:metrics(j.cr),own:!!oj[j.id]}));
  // incastri possibili per uno spazio di capacita' c (fino a 3 gioielli)
  const PACK=[0,1,2,3].map(c=>{const out=[[]];
    const rec=(start,cap,cur)=>{for(let i=start;i<jw.length;i++){if(jw[i].sz<=cap){const nx=cur.concat([i]);out.push(nx);rec(i,cap-jw[i].sz,nx)}}};
    rec(0,c,[]);return out});
  const bestPerSlot=want.map((w,k)=>Math.max(0,...jw.map(j=>j.v[k]/j.sz)));
  const maxV=cand.map(L=>want.map((w,k)=>Math.max(...L.map(x=>x.v[k]))));
  const maxSl=cand.map(L=>Math.max(...L.map(x=>x.sl)));
  // riempimento piu' economico: per capacita' in ordine, stato = punti mancanti
  const memo=new Map();          // il riempimento dipende solo da spazi e punti mancanti: si riusa tra le combinazioni
  function fill(caps,deficit){
    const go=(ci,def)=>{
      if(def.every(d=>d<=0)) return {m:ZERO,js:[]};
      if(ci>=caps.length) return null;
      let left=0;for(let c=ci;c<caps.length;c++)left+=caps[c];
      if(def.some((d,k)=>d>0&&left*bestPerSlot[k]<d)) return null;
      const key=caps.slice(ci).join('')+'|'+def.map(d=>Math.max(0,d)).join(',');
      if(memo.has(key)) return memo.get(key);
      let best=null;
      for(const pk of PACK[caps[ci]]){
        const nd=def.slice();let m=ZERO;
        for(const i of pk){const j=jw[i];for(let k=0;k<K;k++)nd[k]-=j.v[k];m=addM(m,j.own?ZERO:j.m)}
        const r=go(ci+1,nd); if(!r) continue;
        const tot=addM(m,r.m);
        if(!best||tot.mon<best.m.mon||(tot.mon===best.m.mon&&tot.eff<best.m.eff)) best={m:tot,js:pk.map(i=>jw[i].id).concat(r.js)};
      }
      memo.set(key,best);return best;
    };
    return go(0,deficit);
  }
  const KEYS={mat:r=>[r.m.all,r.m.mon,-r.df],drop:r=>[r.m.eff,r.m.mon,-r.df],def:r=>[-r.df,r.m.mon,r.m.eff]};
  const TOP={mat:[],drop:[],def:[]};
  const cmp=(a,b)=>{for(let i=0;i<a.length;i++){if(a[i]!==b[i])return a[i]-b[i]}return 0};
  function keep(r){for(const k in TOP){const L=TOP[k],kr=KEYS[k](r);
    if(L.length<LIMIT||cmp(kr,KEYS[k](L[L.length-1]))<0){L.push(r);L.sort((x,y)=>cmp(KEYS[k](x),KEYS[k](y)));if(L.length>LIMIT)L.pop()}}}
  // visita a pila, a blocchi per non bloccare la pagina
  const t0=performance.now(); let tried=0, found=0, stopped=false;
  const stack=[{p:0,pick:[],v:tal.slice()}];
  RUN={stop(){stopped=true}};
  $('go').disabled=true;$('stop').disabled=false;
  function chunk(){
    const end=performance.now()+40;
    while(stack.length&&performance.now()<end&&!stopped){
      const n=stack.pop();
      if(n.p===5){
        tried++;
        const caps=[S.ws,S.ts].concat(n.pick.map(x=>x.sl)).filter(c=>c>0).sort((a,b)=>b-a);
        const def=want.map((w,k)=>w.thr-n.v[k]);
        const f=fill(caps,def); if(!f) continue;
        found++;
        let m=ZERO;n.pick.forEach(x=>m=addM(m,x.m));m=addM(m,f.m);
        keep({ids:n.pick.map(x=>x.id),js:f.js,m,df:n.pick.reduce((s,x)=>s+x.df,0),caps});
        continue;
      }
      // potatura: punti ancora raggiungibili con le parti rimaste e tutti gli spazi possibili
      for(const x of cand[n.p]){
        const v=n.v.map((a,k)=>a+x.v[k]);
        let ok=true, slots=S.ws+S.ts+x.sl+n.pick.reduce((s,y)=>s+y.sl,0);
        for(let q=n.p+1;q<5;q++)slots+=maxSl[q];
        // ogni gioiello da' punti positivi a una sola abilita': gli spazi mancanti si sommano tra le abilita'
        let need=0;
        for(let k=0;k<K&&ok;k++){let mx=v[k];for(let q=n.p+1;q<5;q++)mx+=maxV[q][k];const d=want[k].thr-mx;
          if(d>0){if(!bestPerSlot[k])ok=false;else need+=d/bestPerSlot[k]}}
        if(need>slots+1e-9) ok=false;
        if(ok) stack.push({p:n.p+1,pick:n.pick.concat([x]),v});
      }
    }
    const secs=((performance.now()-t0)/1000).toFixed(1);
    if(stack.length&&!stopped&&performance.now()-t0<MAXTIME){$('status').textContent=t('searching',{n:tried,f:found});setTimeout(chunk,0);return}
    const cut=stack.length>0;
    $('status').textContent='';
    RUN=null;$('go').disabled=false;$('stop').disabled=true;
    LASTRES={TOP,found,secs,cut,want};render();
  }
  chunk();
}
let LASTRES=null;
function activated(ids,js){
  const tot={};
  const add=(i,n)=>{if(i)tot[i]=(tot[i]||0)+n};
  ids.forEach(id=>id&&A[id].sk.forEach(([i,n])=>add(i,n)));
  js.forEach(id=>J[id].sk.forEach(([i,n])=>add(i,n)));
  add(+S.tk1,+S.tp1||0);add(+S.tk2,+S.tp2||0);
  const out=[];
  for(const [tr,p] of Object.entries(tot)){
    const L=D.acts.filter(a=>a[0]===+tr);
    const pos=L.filter(a=>a[1]>0&&p>=a[1]).sort((a,b)=>b[1]-a[1])[0], neg=L.filter(a=>a[1]<0&&p<=a[1]).sort((a,b)=>a[1]-b[1])[0];
    if(pos)out.push([ACN(pos[2]),1]);if(neg)out.push([ACN(neg[2]),-1]);
  }
  return out;
}
function renderRes(){
  const R=LASTRES; if(!R){$('res').innerHTML='';return}
  const L=R.TOP[S.sort];
  let h=`<p class="note">${t('done',{f:R.found,s:R.secs,k:L.length})}${R.cut?' '+t('truncated',{s:R.secs}):''}</p>`;
  if(!L.length){$('res').innerHTML=h+`<p class="empty">${t('no_res')}</p>`;return}
  const oj=S.ownJ?owned('gioielli-tri'):{};
  h+=L.map((r,ix)=>{
    const used=r.caps.reduce((s,c)=>s+c,0)-r.js.reduce((s,id)=>s+J[id].sz,0);
    const jc={};r.js.forEach(id=>jc[id]=(jc[id]||0)+1);
    const drop=r.m.pn?Math.round(100*r.m.pw/r.m.pn):null;
    return `<article class="detail res"><div class="monh"><h3>#${ix+1}</h3><span class="note">${esc(TM('def'))} <b>${r.df}</b> · ${t('free_slots',{n:used})}</span></div>
      <table><tbody>${PARTS.map((p,k)=>`<tr><td class="note">${esc(PN(p))}</td><td>${r.ids[k]?esc(nm(A[r.ids[k]])):'—'}</td></tr>`).join('')}</tbody></table>
      ${r.js.length?`<div class="row" style="gap:6px">${Object.entries(jc).map(([id,n])=>`<span class="badge ${oj[id]?'shop':''}">${esc(nm(J[id]))} ×${n} · ${oj[id]?t('j_own'):t('j_make')}</span>`).join('')}</div>`:''}
      <div class="row" style="gap:6px">${activated(r.ids,r.js).map(([n,s])=>`<span class="badge ${s>0?'shop':'neg'}">${esc(n)}</span>`).join('')}</div>
      <p class="note">${t('r_mats',{m:r.m.mon,t:r.m.all})}${drop!==null?' · '+t('r_drop',{p:drop}):''} · ${t('r_eff',{e:Math.round(r.m.eff)})}</p>
      <div class="row"><button class="btn sm" data-addres="${ix}">${t('add_to_set')}</button><span class="note" id="am${ix}"></span></div></article>`}).join('');
  $('res').innerHTML=h;
}
function render(){
  applyStatic();
  const seg=(el,key,opts)=>{$(el).innerHTML=opts.map(([v,l])=>`<button data-k="${key}" data-v="${v}" aria-pressed="${String(S[key])===String(v)}">${esc(l)}</button>`).join('')};
  seg('clsseg','cls',[['b',TM('blade')],['g',TM('gun')]]);
  seg('sexseg','sex',[['m',t('male')],['f',t('female')]]);
  seg('rkseg','rk',[['LR',t('lr_only')],['HR',t('lr_hr')]]);
  seg('wsseg','ws',[0,1,2,3].map(n=>[n,n?'◯'.repeat(n):'0']));
  seg('tsseg','ts',[0,1,2,3].map(n=>[n,n?'◯'.repeat(n):'0']));
  seg('sortseg','sort',[['mat',t('sort_mat')],['drop',t('sort_drop')],['def',t('sort_def')]]);
  const opts=POS.filter(a=>!S.want.some(w=>w[0]===a[0]&&w[1]===a[1])).map(a=>[a,ACN(a[2])+' ('+SKN(a[0])+' +'+a[1]+')']).sort((x,y)=>x[1].localeCompare(y[1]));
  $('addskill').innerHTML=`<option value="">${esc(t('pick_skill'))}</option>`+opts.map(([a,l])=>`<option value="${a[0]}:${a[1]}">${esc(l)}</option>`).join('');
  $('wanted').innerHTML=S.want.map(([tr,thr],i)=>{const a=POS.find(x=>x[0]===tr&&x[1]===thr);return `<span class="badge shop">${esc(a?ACN(a[2]):SKN(tr))} · ${esc(SKN(tr))} ${thr} <button class="xb" data-unwant="${i}" aria-label="${esc(t('rm'))}">×</button></span>`}).join('');
  const trees=D.skills[GL()]||D.skills.en;
  const topt=sel=>`<option value="0">${esc(t('t_none'))}</option>`+[...new Set(D.acts.map(a=>a[0]))].map(i=>[i,trees[i]]).sort((x,y)=>x[1].localeCompare(y[1])).map(([i,n])=>`<option value="${i}" ${+sel===i?'selected':''}>${esc(n)}</option>`).join('');
  $('tk1').innerHTML=topt(S.tk1);$('tk2').innerHTML=topt(S.tk2);$('tp1').value=S.tp1;$('tp2').value=S.tp2;
  $('onlyown').checked=S.onlyOwn;$('ownj').checked=S.ownJ;
  renderRes(); save();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.k){S[b.dataset.k]=['ws','ts'].includes(b.dataset.k)?+b.dataset.v:b.dataset.v;render()}
  else if(b.dataset.unwant!==undefined){S.want.splice(+b.dataset.unwant,1);render()}
  else if(b.dataset.addres!==undefined){
    const r=LASTRES.TOP[S.sort][+b.dataset.addres];
    let M={sel:[],q:{}};try{M=Object.assign(M,JSON.parse(localStorage.getItem('mioset-tri')||'{}'))}catch(x){}
    M.q=M.q||{};
    r.ids.filter(Boolean).forEach(id=>{if(!M.sel.includes(id))M.sel.push(id)});
    r.js.forEach(id=>{if(!M.sel.includes(id)){M.sel.push(id);M.q[id]=1}else M.q[id]=(M.q[id]||1)+1});
    try{localStorage.setItem('mioset-tri',JSON.stringify(M))}catch(x){}
    $('am'+b.dataset.addres).textContent=t('added_set');
  }
});
document.addEventListener('change',e=>{const x=e.target;
  if(x.id==='addskill'&&x.value){const [tr,thr]=x.value.split(':').map(Number);S.want.push([tr,thr]);render()}
  else if(['tk1','tk2'].includes(x.id)){S[x.id]=+x.value;render()}
  else if(['tp1','tp2'].includes(x.id)){S[x.id]=+x.value||0;save()}
  else if(x.id==='onlyown'){S.onlyOwn=x.checked;save()}
  else if(x.id==='ownj'){S.ownJ=x.checked;save()}
});
$('go').onclick=search;
$('stop').onclick=()=>{if(RUN)RUN.stop()};
langSelect(render);
render();
</script>

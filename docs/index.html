<style>
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}a{color:var(--accent)}
/* Layout: banco del fabbro, albero delle armi a sinistra e conto dei materiali a destra, impilati su telefono */
:root{
  --bg:#eef1f3; --panel:#ffffff; --fg:#1b2329; --muted:#5d6b75; --line:#d5dce1; --sunk:#f5f7f8;
  --lr:#1f7a6d; --lr-soft:#dff1ed; --hr:#b4580f; --hr-soft:#fbe9d8; --accent:#2b4a63; --on-accent:#ffffff; --own:#3f7d3a; --own-soft:#e3f0df;
  --f-head:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171b; --panel:#1a2127; --fg:#e4e9ec; --muted:#93a1ab; --line:#2c363e; --sunk:#151b20;
  --lr:#5cc4b3; --lr-soft:#173430; --hr:#f0a35e; --hr-soft:#3a2614; --accent:#8fb3d1; --on-accent:#10161b; --own:#86c47e; --own-soft:#1d3119; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171b; --panel:#1a2127; --fg:#e4e9ec; --muted:#93a1ab; --line:#2c363e; --sunk:#151b20;
  --lr:#5cc4b3; --lr-soft:#173430; --hr:#f0a35e; --hr-soft:#3a2614; --accent:#8fb3d1; --on-accent:#10161b; --own:#86c47e; --own-soft:#1d3119; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1320px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.2rem;font-weight:700;line-height:1.05}
h2{font-size:1.4rem;font-weight:600}
h3{font-size:.95rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0;max-width:72ch}
.lede{color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.stat{font-family:var(--f-num);font-size:12.5px;color:var(--muted);margin-left:auto}
.stat b{color:var(--fg);font-weight:500}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--accent)}
.main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:4px 10px;cursor:pointer;font-size:12.5px;display:inline-flex;gap:6px;align-items:baseline}
.tab small{font-family:var(--f-num);color:var(--muted);font-size:11px}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tab[aria-pressed="true"] small{color:inherit;opacity:.8}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search]{flex:1 1 180px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.tree{max-height:72vh;overflow:auto;border-top:1px solid var(--line);padding-top:6px}
@media (max-width:900px){.tree{max-height:none}}
.tree ul{list-style:none;margin:0;padding:0 0 0 16px;border-left:1px dashed var(--line)}
.tree>ul{padding-left:0;border-left:0}
.tree li{margin:0}
.node{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:6px}
.node:hover{background:var(--sunk)}
.node.sel{background:var(--sunk);box-shadow:inset 2px 0 0 var(--accent)}
.node input{margin:0;accent-color:var(--own);width:15px;height:15px;flex:none}
.node .nm{background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0;flex:1;display:flex;flex-direction:column}
.node .nm span{font-size:13.5px}
.node .nm small{font-size:11.5px;color:var(--muted)}
.node.own .nm span{color:var(--own)}
.node .cost{font-family:var(--f-num);font-size:11.5px;color:var(--muted);flex:none}
.node.own .cost{visibility:hidden}
.badge{font-size:10.5px;font-weight:600;letter-spacing:.05em;padding:1px 6px;border-radius:99px;background:var(--sunk);color:var(--muted);border:1px solid var(--line);flex:none}
.tog{width:18px;flex:none;background:none;border:0;cursor:pointer;color:var(--muted);padding:0;font-size:11px}
.tog.none{visibility:hidden}
.ref .nm span{font-style:italic;color:var(--muted)}
.hidden-c>ul{display:none}
.detail{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.detail .rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.detail ul{margin:0;padding-left:16px}
.pill{display:inline-block;font:600 10.5px var(--f-body);letter-spacing:.08em;padding:2px 7px;border-radius:99px}
.pill.lr{background:var(--lr-soft);color:var(--lr)}.pill.hr{background:var(--hr-soft);color:var(--hr)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.n{text-align:right;font-family:var(--f-num);font-size:12.5px;white-space:nowrap}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.matrix td.z{color:var(--line)}
.matrix tbody tr{cursor:pointer}
.matrix tbody tr:hover td{background:var(--sunk)}
.matrix tfoot td{font-weight:600;border-top:2px solid var(--line)}
.mon{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;scroll-margin-top:120px}
.monh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.monh .n{color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.cols{grid-template-columns:1fr}}
.cols>div{min-width:0}
.cols td:first-child small{display:block;color:var(--muted);font-size:11.5px}
.empty{color:var(--muted);font-style:italic;font-size:12.5px}
.done{color:var(--own);font-weight:500}
.note{font-size:12.5px;color:var(--muted)}
textarea{width:100%;min-height:60px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--f-num);font-size:11.5px}
details>summary{cursor:pointer}
.badge.shop{background:var(--own-soft);color:var(--own);border-color:transparent}
.shopnote{font-size:12.5px;color:var(--own)}
ol.path{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
ol.path>li>span{font-size:13.5px}
ul.pm{margin:2px 0 0;padding-left:16px;font-size:12.5px;color:var(--muted)}
.langsel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;flex:none}
.hbar{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;margin-left:6px}
.hbar.lr{background:var(--lr)}.hbar.hr{background:var(--hr)}
.mat{display:flex;flex-direction:column}
.mat small{display:block}
.panel.mon{border-top:1px solid var(--line)}
#sum tbody tr:hover td{background:var(--sunk)}
.nav{display:flex;flex-wrap:wrap;gap:6px}
.nav a{font-size:13px;font-weight:500;text-decoration:none;color:var(--fg);border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 12px}
.nav a:hover{border-color:var(--accent)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.sumt th,.sumt td{white-space:nowrap}
.sumt tbody tr{cursor:pointer}
.sumt tbody tr:hover td{background:var(--sunk)}
.sumt .g0{border-left:1px solid var(--line)}
.sumt .gh{text-align:center;border-left:1px solid var(--line);color:var(--fg)}
.sumt .sumc{background:var(--sunk);font-weight:600}
.sumt tfoot td{font-weight:600;border-top:2px solid var(--line)}
.z{color:var(--line)}
.mt th{font-size:10.5px}
.mt td.n{width:3.6em}
.sumt tr>:first-child{position:sticky;left:0;background:var(--panel);z-index:1}
.sumt tbody tr:hover>:first-child{background:var(--sunk)}
@media (max-width:600px){.sumt tr>:first-child{max-width:7.5em;white-space:normal}}
#jump{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--fg)}
#sel td small,#out td small{display:block;color:var(--muted);font-size:11.5px}
#sel td{vertical-align:middle}
.btn.sm{padding:2px 9px;font-size:12px;flex:none}
#pick .node>.nm{cursor:pointer}
#pick span.nm{cursor:default}
#q{flex:none}

</style>
</head>

function allPaths(id,useOwn,target,depth=0){
  const w=W[id],o=[];
  if(useOwn&&S.own[id]&&id!==target) o.push({cost:{},steps:[{id,how:'own'}]});
  if(w.buy) o.push({cost:{},steps:[{id,how:'buy'}]});
  if(w.cr) o.push({cost:w.cr,steps:[{id,how:Object.keys(w.cr).length?'create':'other',m:w.cr}]});
  if(w.up&&depth<30) for(const p of w.p) for(const q of allPaths(p,useOwn,target,depth+1)){
    if(o.length>400) break; o.push({cost:sumC(q.cost,w.up),steps:q.steps.concat([{id,how:'up',m:w.up,from:p}])});}
  return o;
}
const sortP=(L,metric)=>L.sort((x,y)=>U(x.cost,metric)-U(y.cost,metric)||U(x.cost,'all')-U(y.cost,'all')||x.steps.length-y.steps.length);

function step(w){if(w.buy)return {};const o=[];if(w.cr)o.push(w.cr);if(w.up)o.push(w.up);return o.sort((a,b)=>U(a,'all')-U(b,'all'))[0]||{}}
const stepHow=w=>w.buy?'buy':(w.cr&&!Object.keys(w.cr).length)?'other':(w.cr&&(!w.up||U(w.cr,'all')<=U(w.up,'all')))?'create':'up';

  return out;
}

}

function buildTree(kind){
  const ws=D.w.filter(w=>w.k===kind);
  const q=$('q').value.trim().toLowerCase();
  const hit=w=>!q||Object.values(w.n).join(' ').toLowerCase().includes(q);
  const subHit=(w,seen=new Set())=>{if(seen.has(w.id))return false;seen.add(w.id);return hit(w)||w.c.some(c=>W[c]&&W[c].p[0]===w.id&&subHit(W[c],seen))};
  function li(w,parentId){
    const ref=w.p.length>1&&w.p[0]!==parentId;
    const kids=ref?[]:w.c.filter(c=>W[c]);
    if(q&&!ref&&!subHit(w)) return '';
    if(q&&ref&&!hit(w)) return '';
    const own=!!S.own[w.id];
    const b=[];
    if(w.buy) b.push(`<span class="badge shop" title="${w.buy.set?esc(t('b_shop_set_tt',{x:nm(W[w.buy.set])})):esc(t('b_shop_tt'))}">${t('b_shop')}</span>`);
    if(w.cr&&Object.keys(w.cr).length&&w.p.length) b.push(`<span class="badge" title="${esc(t('b_cr_tt'))}">${t('b_cr')}</span>`);
    if(w.p.length>1&&!ref) b.push(`<span class="badge" title="${esc(t('b_or_tt',{x:w.p.slice(1).map(p=>nm(W[p])).join(', ')}))}">${t('b_or',{n:w.p.length})}</span>`);
    if(w.hrf) b.push(`<span class="badge">${t('b_hrf')}</span>`);
    if(w.lv&&own) b.push(`<span class="badge">${t('lv')}${S.lv[w.id]||1}/${w.cap}</span>`);
    const col=S.collapsed[w.id], sub=nm2(w);
    let h=`<li class="${col?'hidden-c':''}"><div class="node ${own?'own':''} ${S.sel===w.id?'sel':''} ${ref?'ref':''}">`+
      `<button class="tog ${kids.length?'':'none'}" data-tog="${w.id}" aria-label="${esc(t('toggle'))}">${col?'▸':'▾'}</button>`+
      `<input type="checkbox" data-own="${w.id}" ${own?'checked':''} aria-label="${esc(t('owned'))}: ${WN(w.id)}">`+
      `<button class="nm" data-sel="${w.id}"><span>${WN(w.id)}${ref?' '+t('other_branch'):''}</span>${sub?`<small>${esc(sub)}</small>`:''}</button>${b.join('')}<span class="cost" title="${esc(t('cost_tt'))}">${monUnits(cost(w))}</span></div>`;
    if(kids.length) h+='<ul>'+kids.map(c=>li(W[c],w.id)).join('')+'</ul>';
    return h+'</li>';
  }
  return '<ul>'+ws.filter(w=>!w.p.length).map(r=>li(r,null)).join('')+'</ul>';
}

function render(){
  applyStatic();
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===S.mode));
  document.querySelectorAll('.panel>.seg [data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===S.view));
  $('lvon').checked=S.lvon;
  renderTabs(); const sc=$('tree').scrollTop; $('tree').innerHTML=buildTree(S.kind); $('tree').scrollTop=sc;
  renderDetail(); renderOut(); $('code').value=btoa(Object.keys(S.own).filter(k=>S.own[k]).map(k=>k+(S.lv[k]>1?'@'+S.lv[k]:'')).join(','));
  save();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.mode){S.mode=b.dataset.mode;render()}
  else if(b.dataset.view){S.view=b.dataset.view;render();if(S.view==='path')$('out').scrollIntoView({block:'nearest'})}
  else if(b.dataset.metric){S.metric=b.dataset.metric;render()}
  else if(b.id==='pathdone'){const w=W[S.sel];const p=sortP(allPaths(w.id,S.fromOwn,w.id),S.metric)[0];if(p.steps[0].how==='own')delete S.own[p.steps[0].id];S.own[w.id]=true;render()}
  else if(b.dataset.kind){S.kind=b.dataset.kind;render()}
  else if(b.dataset.kf){const k=b.dataset.kf;if(k==='*'||k==='-')KINDS.forEach(x=>S.kf[x]=k==='*');else S.kf[k]=!S.kf[k];render()}
  else if(b.dataset.sel){S.sel=b.dataset.sel;render()}
  else if(b.dataset.tog){S.collapsed[b.dataset.tog]=!S.collapsed[b.dataset.tog];render()}
  else if(b.dataset.mr!==undefined){S.mrank=b.dataset.mr;render()}
});
document.addEventListener('change',e=>{
  const x=e.target;
  if(x.dataset.own){if(x.checked)S.own[x.dataset.own]=true;else delete S.own[x.dataset.own];render()}
  else if(x.id==='lvon'){S.lvon=x.checked;render()}
  else if(x.id==='fromown'){S.fromOwn=x.checked;render()}
  else if(x.id==='lvsel'){S.lv[S.sel]=+x.value;render()}
});
$('out').addEventListener('click',e=>{const tr=e.target.closest('tr[data-m]');if(tr){S.view='mon';render();const el=$('m-'+tr.dataset.m);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}});
$('q').addEventListener('input',()=>{$('tree').innerHTML=buildTree(S.kind)});
$('allk').onclick=()=>{D.w.filter(w=>w.k===S.kind).forEach(w=>S.own[w.id]=true);render()};
$('nonek').onclick=()=>{D.w.filter(w=>w.k===S.kind).forEach(w=>delete S.own[w.id]);render()};
$('expk').onclick=()=>{const ws=D.w.filter(w=>w.k===S.kind&&w.c.length);const any=ws.some(w=>!S.collapsed[w.id]);ws.forEach(w=>S.collapsed[w.id]=any);render()};
$('copy').onclick=()=>{const v=$('code').value;navigator.clipboard.writeText(v).then(()=>$('codemsg').textContent=t('copied'),()=>{$('code').select();$('codemsg').textContent=t('copy_sel')})};
$('load').onclick=()=>{try{const s=atob($('code').value.trim());S.own={};S.lv={};s.split(',').filter(Boolean).forEach(x=>{const [id,l]=x.split('@');if(W[id]){S.own[id]=true;if(l)S.lv[id]=+l}});render();$('codemsg').textContent=t('loaded')}catch(err){$('codemsg').textContent=t('bad_code')}};
$('reset').onclick=()=>{const r=$('reset');if(r.dataset.arm){S.own={};S.lv={};delete r.dataset.arm;render();$('codemsg').textContent=t('cleared')}else{r.dataset.arm=1;r.textContent=t('reset_ok')}};
langSelect(render);
render();
</script>

</body>
</html>

}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1320px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.2rem;font-weight:700;line-height:1.05}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:500}

.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}

.scroll{overflow-x:auto}
.matrix td.z{color:var(--line)}

let LANG='it';
try{const l=localStorage.getItem('tri-lang');if(l&&TXT[l])LANG=l;else{const n=(navigator.language||'').slice(0,2);if(TXT[n])LANG=n}}catch(e){}
const t=(k,v)=>{let s=(TXT[LANG][k]!==undefined?TXT[LANG][k]:TXT.it[k]);if(v&&typeof s==='string')for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};
const GL=()=>GAME_LANGS.includes(LANG)?LANG:'en';
const nm=o=>o.n[GL()]||o.n.en;                           // nome di gioco di un'arma o materiale
const nm2=o=>LANG==='en'?'':(GAME_LANGS.includes(LANG)?o.n.en:'');  // nome inglese come riferimento
function monName(k){if(k==='Rathian + Rathalos')return t('grp_rr');if(k.startsWith('Draghi anziani'))return t('grp_elder');
  const m=(D.mnames||{})[k];return m?(m[LANG]||m.en):k}
function langSelect(onchange){
  const s=document.getElementById('lang');
  s.innerHTML=LANGS.map(([c,n])=>`<option value="${c}" ${c===LANG?'selected':''}>${n}</option>`).join('');
  s.setAttribute('aria-label',t('lang'));
  s.addEventListener('change',()=>{LANG=s.value;try{localStorage.setItem('tri-lang',LANG)}catch(e){}document.documentElement.lang=LANG;onchange()});
  document.documentElement.lang=LANG;
}
function applyStatic(){document.querySelectorAll('[data-t]').forEach(el=>{el.innerHTML=t(el.dataset.t)});
  document.querySelectorAll('[data-tp]').forEach(el=>{el.placeholder=t(el.dataset.tp)});
  document.querySelectorAll('[data-ta]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.ta))});
  const fb=document.getElementById('fallback');if(fb){fb.hidden=GAME_LANGS.includes(LANG);fb.textContent=t('fallback')}
  const h=document.getElementById('h1');if(h)document.title=h.textContent;}

const J={};D.decos.forEach(j=>J[j.id]=j);
const IT=D.items, MONS=D.mons;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKN=i=>(D.skills[GL()]||D.skills.en)[i]||'?';
const dots=n=>'◯'.repeat(n);
const skTxt=j=>j.sk.map(([i,n])=>`${SKN(i)} ${n>0?'+':''}${n}`).join(', ');
let S={own:{},sz:0,view:'mon',sel:null};
try{const s=JSON.parse(localStorage.getItem('gioielli-tri')||'null');if(s)S=Object.assign(S,s,{sel:null})}catch(e){}
const save=()=>{try{const {sel,...k}=S;localStorage.setItem('gioielli-tri',JSON.stringify(k))}catch(e){}};
const monUnits=c=>Object.entries(c||{}).reduce((a,[i,n])=>a+(IT[i].g==='m'?n:0),0);
const pill=i=>IT[i].r?`<span class="pill ${IT[i].r.toLowerCase()}">${IT[i].r}</span>`:'';
function visible(){
  const q=$('q').value.trim().toLowerCase();
  return D.decos.filter(j=>(!S.sz||j.sz===S.sz)&&(!q||(Object.values(j.n).join(' ')+' '+j.sk.map(([i])=>Object.values(D.skills).map(L=>L[i]).join(' ')).join(' ')).toLowerCase().includes(q)));
}
function renderList(){
  const L=visible();
  $('list').innerHTML='<ul>'+L.map(j=>{const o=!!S.own[j.id];
    return `<li><div class="node ${o?'own':''} ${S.sel===j.id?'sel':''}"><span class="tog none"></span><input type="checkbox" data-own="${j.id}" ${o?'checked':''} aria-label="${esc(t('owned'))}: ${esc(nm(j))}">
      <button class="nm" data-sel="${j.id}"><span>${esc(nm(j))} <span class="note">${dots(j.sz)}</span></span><small>${esc(skTxt(j))}${nm2(j)?' · '+esc(nm2(j)):''}</small></button><span class="cost" title="${esc(t('cost_tt'))}">${monUnits(j.cr)}</span></div></li>`}).join('')+'</ul>';
}
function renderDetail(){
  const j=J[S.sel]; if(!j){$('detail').innerHTML=`<p class="note">${t('j_hint')}</p>`;return}
  $('detail').innerHTML=`<div class="detail"><div class="monh"><h2>${esc(nm(j))}</h2><span class="note">${t('j_size')}: ${dots(j.sz)} · ${t('craftable')}</span>
    <label class="chk" style="margin-left:auto"><input type="checkbox" data-own="${j.id}" ${S.own[j.id]?'checked':''}> ${t('owned')}</label></div>
    <div class="row" style="gap:6px">${j.sk.map(([i,n])=>`<span class="badge ${n>0?'shop':''}">${esc(SKN(i))} ${n>0?'+':''}${n}</span>`).join('')}</div>
    <div><h3>${t('create')}</h3><ul class="pm">${Object.entries(j.cr).map(([i,n])=>`<li>${esc(nm(IT[i]))} ×${n} ${pill(i)}${IT[i].mon?` <span class="note">${esc(monName(IT[i].mon))}</span>`:''}</li>`).join('')}</ul></div></div>`;
}
function renderOut(){
  const all={},by={};
  for(const j of D.decos){ if(S.own[j.id]||(S.sz&&j.sz!==S.sz)) continue; for(const [i,n] of Object.entries(j.cr)){all[i]=(all[i]||0)+n;(by[i]=by[i]||[]).push(nm(j))} }
  let h='';
  if(S.view==='mon'){
    for(const m of MONS){
      const R={LR:[],HR:[]};
      for(const [i,n] of Object.entries(all)){const it=IT[i];if(it.g==='m'&&it.mon===m)R[it.r].push([i,n])}
      const a=R.LR.reduce((s,x)=>s+x[1],0),b=R.HR.reduce((s,x)=>s+x[1],0); if(!a&&!b) continue;
      const tb=L=>L.length?'<table><tbody>'+L.sort((x,y)=>y[1]-x[1]).map(([i,n])=>`<tr><td>${esc(nm(IT[i]))}<small>${esc(by[i].join(' · '))}</small></td><td class="n">${n}</td></tr>`).join('')+'</tbody></table>':`<p class="empty">${t('nothing')}</p>`;
      h+=`<div class="mon"><div class="monh"><h2>${esc(monName(m))}</h2><span class="n">LR ${a} · HR ${b}</span></div><div class="cols"><div><span class="pill lr">${t('lr')}</span>${tb(R.LR)}</div><div><span class="pill hr">${t('hr')}</span>${tb(R.HR)}</div></div></div>`;
    }
    if(!h) h=`<p class="done">${t('no_missing')}</p>`;
  } else {
    for(const g of ['gen','oth','coin']){
      const L=Object.entries(all).filter(([i])=>IT[i].g===g).sort((x,y)=>y[1]-x[1]);
      h+=`<div class="mon"><div class="monh"><h2>${t('g_'+g)}</h2></div>`+(L.length?'<table><tbody>'+L.map(([i,n])=>`<tr><td>${esc(nm(IT[i]))} ${pill(i)}<small>${esc(by[i].length+' × '+t('col_j').toLowerCase())}</small></td><td class="n">${n}</td></tr>`).join('')+'</tbody></table>':`<p class="empty">${t('nothing')}</p>`)+'</div>';
    }
  }
  $('out').innerHTML=h;
  const mu=Object.entries(all).reduce((a,[i,n])=>a+(IT[i].g==='m'?n:0),0);
  $('stat').innerHTML=t('stat_jew',{o:D.decos.filter(j=>S.own[j.id]).length,t:D.decos.length,m:mu});
}
function render(){
  applyStatic();
  $('szseg').innerHTML=[[0,t('size_all')],[1,dots(1)],[2,dots(2)],[3,dots(3)]].map(([v,l])=>`<button data-sz="${v}" aria-pressed="${S.sz===v}">${l}</button>`).join('');
  document.querySelectorAll('.panel>.seg [data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===S.view));
  const sc=$('list').scrollTop; renderList(); $('list').scrollTop=sc;
  renderDetail(); renderOut(); $('code').value=btoa(Object.keys(S.own).filter(k=>S.own[k]).join(','));
  save();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.sz!==undefined){S.sz=+b.dataset.sz;render()}
  else if(b.dataset.view){S.view=b.dataset.view;render()}
  else if(b.dataset.sel){S.sel=b.dataset.sel;render()}
});
document.addEventListener('change',e=>{const x=e.target;if(x.dataset.own){if(x.checked)S.own[x.dataset.own]=true;else delete S.own[x.dataset.own];render()}});
$('q').addEventListener('input',renderList);
$('allk').onclick=()=>{visible().forEach(j=>S.own[j.id]=true);render()};
$('nonek').onclick=()=>{visible().forEach(j=>delete S.own[j.id]);render()};
$('copy').onclick=()=>{const v=$('code').value;navigator.clipboard.writeText(v).then(()=>$('codemsg').textContent=t('copied'),()=>{$('code').select();$('codemsg').textContent=t('copy_sel')})};
$('load').onclick=()=>{try{const s=atob($('code').value.trim());S.own={};s.split(',').filter(Boolean).forEach(id=>{if(J[id])S.own[id]=true});render();$('codemsg').textContent=t('loaded')}catch(err){$('codemsg').textContent=t('bad_code')}};
$('reset').onclick=()=>{const r=$('reset');if(r.dataset.arm){S.own={};delete r.dataset.arm;render();$('codemsg').textContent=t('cleared')}else{r.dataset.arm=1;r.textContent=t('reset_ok')}};
langSelect(render);
render();
</script>
